name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release:
    name: Publish to Maven Central + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Derive release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set project version
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="$RELEASE_VERSION"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Build, sign and publish libraries to Maven Central
        run: mvn -B -ntp -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Stage CLI jar
        run: cp hive-cli/target/hive-cli.jar "hive-cli-${RELEASE_VERSION}.jar"

      - name: Create GitHub Release with the CLI jar
        uses: softprops/action-gh-release@v2
        with:
          files: hive-cli-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true
